  <a routerLink="/carrito">Carrito</a>
  <a routerLink="/pedido">Pedido</a>
  <a routerLink="/create_login">crear </a>
  <a routerLink="/">Volver a Inicio</a>
</nav>

<main class="login-main">

  <div class="login-section">
    <h1>Iniciar Sesion</h1>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div>
        <label for="email">Correo Electronico:</label>

        <input 
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
        email
        placeholder="Ej. nombre@gmail.com"
        >
      </div>

      <div>

        <label for="password">Contraseña:</label>
        <input 
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        >
      </div>

      <a href="#">Olvide mi contraseña</a>

      <button type="submit" [disabled]="!loginForm.form.valid">
        Iniciar Sesion
      </button>
    </form>
  </div>

  <div class="register-section">
    <h1>Crear cuenta</h1>
    <p><strong>Crea y aprovecha los beneficios:</strong></p>
    <ul>
      <li>Realiza tus compras de manera más ágil.</li>
    </ul>
    <button type="button" routerLink="/create_login">Crear cuenta</button>


  </div>

</main>
